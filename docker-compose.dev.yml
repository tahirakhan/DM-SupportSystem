version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: ado-backend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
    environment:
      NODE_ENV: development
    command: npm run dev

  frontend:
    image: node:18-alpine
    container_name: ado-frontend-dev
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start -- --host 0.0.0.0 --disable-host-check

networks:
  default:
    name: ado-dashboard-dev-network
