<div class="app-layout">

  <mat-toolbar color="primary" class="app-toolbar">
    <mat-icon class="toolbar-icon">dashboard</mat-icon>
    <span class="toolbar-title">Delivery Manager Tool</span>
    <span class="spacer"></span>
    <span class="toolbar-subtitle">Stewart &mdash; STEPS</span>
  </mat-toolbar>

  <div class="body-area">

    <app-sidebar
      [collapsed]="sidebarCollapsed"
      (toggleCollapsed)="sidebarCollapsed = !sidebarCollapsed"
    ></app-sidebar>

    <main class="page-area" [@routeAnimations]="prepareRoute(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </main>

  </div>

</div>
