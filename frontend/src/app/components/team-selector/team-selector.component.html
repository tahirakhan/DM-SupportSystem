<mat-form-field appearance="outline">
  <mat-label>Team</mat-label>
  <mat-select
    [value]="current$ | async"
    (selectionChange)="onTeamChange($event.value)"
    [disabled]="(loading$ | async) ?? false"
  >
    <mat-option *ngFor="let team of teams$ | async" [value]="team">
      {{ displayTeamLabel(team) }}
    </mat-option>
  </mat-select>
</mat-form-field>
