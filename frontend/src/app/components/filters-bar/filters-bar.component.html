<div class="filters-bar">
  <div class="filters-row">

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Area Path</mat-label>
      <mat-select [formControl]="areaPathControl">
        <mat-option *ngFor="let p of areaPaths" [value]="p">{{ p }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Iteration Path</mat-label>
      <mat-select [formControl]="iterationPathControl">
        <mat-option *ngFor="let p of iterationPaths" [value]="p">{{ p }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      class="fetch-btn"
      [disabled]="loading"
      (click)="fetchRequested.emit()"
    >
      <mat-spinner *ngIf="loading" diameter="16" class="btn-spinner"></mat-spinner>
      <mat-icon *ngIf="!loading">cloud_download</mat-icon>
      <span>{{ loading ? 'Fetching&hellip;' : 'Fetch Details' }}</span>
    </button>

  </div>
</div>
