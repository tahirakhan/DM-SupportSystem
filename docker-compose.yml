version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: ado-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/config:/app/config:ro
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: ado-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ado-dashboard-network
